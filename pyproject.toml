[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-system"
version = "0.1.0"
description = "Medical Digital Twin + Multi-Agent Debate System using Google ADK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk==1.0.0",
    "google-generativeai==0.8.0",
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "streamlit==1.41.0",
    "faiss-cpu==1.8.0",
    "sentence-transformers==3.1.0",
    "scikit-learn==1.5.0",
    "xgboost==2.1.0",
    "numpy==1.26.4",
    "pandas==2.2.0",
    "scipy==1.13.0",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.0",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.0",
    "aiosqlite==0.20.0",
    "python-jose==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.2.0",
    "presidio-analyzer==2.2.351",
    "presidio-anonymizer==2.2.351",
    "httpx==0.27.0",
    "aiofiles==24.1.0",
    "python-multipart==0.0.9",
    "pytz==2024.1",
    "python-dateutil==2.9.0",
    "mcp==1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "black==24.0.0",
    "ruff==0.5.0",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["medical_ai_system*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "TRY", "SIM", "TID", "ARG", "ERA", "PL", "RUF", "RET", "ASYNC"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true